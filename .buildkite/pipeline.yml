---
agents:
  queue: oss
steps:
- label: BCR overlay / Bazel 8.4.1
  key: bcr-8-4-1
  agents:
    queue: oss
  env:
    USE_BAZEL_VERSION: 8.4.1
  command:
  - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
  - bash .buildkite/bcr.sh
  - buildkite-agent cache save --registry oss-ci-v2 --name bazel
  timeout_in_minutes: 120
  artifact_paths: tests/bcr/bazel-testlogs/**/test.log;tests/bcr/bazel-testlogs/**/test.xml
- label: BCR overlay / Bazel 9.2.0
  key: bcr-9-2-0
  agents:
    queue: oss
  env:
    USE_BAZEL_VERSION: 9.2.0
  command:
  - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
  - bash .buildkite/bcr.sh
  - buildkite-agent cache save --registry oss-ci-v2 --name bazel
  timeout_in_minutes: 120
  artifact_paths: tests/bcr/bazel-testlogs/**/test.log;tests/bcr/bazel-testlogs/**/test.xml
- label: Verify hooks
  key: verify-hooks
  command: bash .buildkite/verify-hooks.sh
  timeout_in_minutes: 15
- label: Cross-build optimized distributions
  key: dist-build
  env:
    USE_BAZEL_VERSION: 9.1.0
  command:
  - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
  - bash .buildkite/build.sh
  - buildkite-agent cache save --registry oss-ci-v2 --name bazel
  timeout_in_minutes: 120
  artifact_paths: release/*
- label: Artifact smoke / linux-amd64
  key: smoke-linux-amd64
  depends_on: dist-build
  agents:
    queue: oss
  command: bash .buildkite/smoke.sh
  timeout_in_minutes: 15
- label: Artifact smoke / darwin-arm64
  key: smoke-darwin-arm64
  depends_on: dist-build
  agents:
    queue: oss_darwin_arm64
  command: bash .buildkite/smoke.sh
  timeout_in_minutes: 15
- label: Artifact smoke / windows-amd64
  key: smoke-windows-amd64
  depends_on: dist-build
  agents:
    queue: oss_win_amd64
  command: powershell -NoProfile -ExecutionPolicy Bypass -File .buildkite/smoke-windows.ps1
  timeout_in_minutes: 15
- label: Stage verified release artifacts on GitHub
  key: release-upload
  depends_on:
  - bcr-8-4-1
  - bcr-9-2-0
  - verify-hooks
  - smoke-linux-amd64
  - smoke-darwin-arm64
  - smoke-windows-amd64
  if: build.tag != null && build.pull_request.id == null
  command: bash .buildkite/release.sh
  timeout_in_minutes: 15
notify:
- github_commit_status:
    context: release-ready/watchman
  if: build.branch == "main" && build.pull_request.id == null && build.tag == null
