---
name: ci
'on':
  push:
    branches:
    - main
  pull_request: {}
  merge_group: {}
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: false
        default: ''
permissions:
  actions: read
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
env:
  CI_RUN_ID: "${{ github.run_id }}-${{ github.run_attempt }}"
  CI_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
    github.run_id }}"
jobs:
  bcr-8-4-1:
    name: BCR overlay / Bazel 8.4.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      USE_BAZEL_VERSION: 8.4.1
      CI_CACHE_DIR: "/tmp/oss-ci"
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: "${{ env.CI_CACHE_DIR }}"
        key: watchman-${{ runner.os }}-bcr-8-4-1-${{ github.run_id }}-${{ github.run_attempt
          }}
        restore-keys: watchman-${{ runner.os }}-bcr-8-4-1-
    - name: Run checks
      run: bash .github/ci/bcr.sh
      shell: bash
  bcr-9-2-0:
    name: BCR overlay / Bazel 9.2.0
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      USE_BAZEL_VERSION: 9.2.0
      CI_CACHE_DIR: "/tmp/oss-ci"
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: "${{ env.CI_CACHE_DIR }}"
        key: watchman-${{ runner.os }}-bcr-9-2-0-${{ github.run_id }}-${{ github.run_attempt
          }}
        restore-keys: watchman-${{ runner.os }}-bcr-9-2-0-
    - name: Run checks
      run: bash .github/ci/bcr.sh
      shell: bash
  verify-hooks:
    name: Verify hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: "${{ env.CI_CACHE_DIR }}"
        key: watchman-${{ runner.os }}-verify-hooks-${{ github.run_id }}-${{ github.run_attempt
          }}
        restore-keys: watchman-${{ runner.os }}-verify-hooks-
    - name: Run checks
      run: |-
        python3 -B .github/scripts/test-gha-release-gate.py
        bash .github/ci/verify-hooks.sh
      shell: bash
    env:
      CI_CACHE_DIR: "/tmp/oss-ci"
  dist-build:
    name: Cross-build optimized distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      USE_BAZEL_VERSION: 9.1.0
      CI_CACHE_DIR: "/tmp/oss-ci"
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: "${{ env.CI_CACHE_DIR }}"
        key: watchman-${{ runner.os }}-dist-build-${{ github.run_id }}-${{ github.run_attempt
          }}
        restore-keys: watchman-${{ runner.os }}-dist-build-
    - name: Run checks
      run: bash .github/ci/build.sh
      shell: bash
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: distributions
        path: release/
        if-no-files-found: error
  smoke-linux-amd64:
    name: Artifact smoke / linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: dist-build
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: distributions
        path: release
    - name: Run checks
      run: bash .github/ci/smoke.sh
      shell: bash
    env:
      CI_CACHE_DIR: "/tmp/oss-ci"
  smoke-darwin-arm64:
    name: Artifact smoke / darwin-arm64
    runs-on: macos-15
    timeout-minutes: 15
    needs: dist-build
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: distributions
        path: release
    - name: Run checks
      run: bash .github/ci/smoke.sh
      shell: bash
    env:
      CI_CACHE_DIR: "/tmp/oss-ci"
  smoke-windows-amd64:
    name: Artifact smoke / windows-amd64
    runs-on: windows-latest
    timeout-minutes: 15
    needs: dist-build
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: distributions
        path: release
    - name: Run checks
      run: pwsh -NoProfile -File .github/ci/smoke-windows.ps1
      shell: pwsh
    env:
      CI_CACHE_DIR: "/tmp/oss-ci"
  ci:
    name: CI
    if: "${{ always() }}"
    needs:
    - bcr-8-4-1
    - bcr-9-2-0
    - verify-hooks
    - dist-build
    - smoke-linux-amd64
    - smoke-darwin-arm64
    - smoke-windows-amd64
    runs-on: ubuntu-latest
    steps:
    - env:
        RESULTS: "${{ toJSON(needs) }}"
      run: |-
        python3 - <<'CHECK'
        import json, os
        results = json.loads(os.environ['RESULTS'])
        failed = [name for name, job in results.items() if job['result'] != 'success']
        if failed:
            raise SystemExit('Failed or skipped checks: ' + ', '.join(failed))
        CHECK
