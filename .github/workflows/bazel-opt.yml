---
name: Publish Buildkite distributions
'on':
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag produced by Buildkite
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    name: Verify ARM64 and publish existing artifacts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      RELEASE_TAG: "${{ github.event.release.tag_name || inputs.tag }}"
      GH_TOKEN: "${{ github.token }}"
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: "${{ github.event.release.tag_name || inputs.tag }}"
    - name: Wait for verified Buildkite outputs
      run: python3 -B .github/scripts/download-release.py
    - name: Native ARM64 artifact smoke
      run: |-
        chmod +x release/watchman-aarch64-linux-gnu
        bash tests/watchman_smoke_test.sh "$PWD/release/watchman-aarch64-linux-gnu"
    - name: Publish verified assets
      run: |
        set -euo pipefail
        python3 - <<'VERIFY'
        import importlib.util, subprocess
        from pathlib import Path
        spec = importlib.util.spec_from_file_location('artifacts', '.buildkite/artifacts.py')
        m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
        m.verify(Path('release'), {'commit': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'pipeline': 'watchman'})
        VERIFY
        python3 - <<'UPLOAD'
        import json, os, subprocess
        assets = json.load(open('.buildkite/assets.json'))
        subprocess.run(['gh','release','upload',os.environ['RELEASE_TAG'],*['release/'+name for name in assets],'--clobber'],check=True)
        UPLOAD
