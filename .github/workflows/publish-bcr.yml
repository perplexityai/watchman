name: Publish BCR overlay

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Checked-in Watchman module version"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate overlay
        run: python3 tests/validate_bcr.py

      - uses: actions/checkout@v6
        with:
          repository: bazelbuild/bazel-central-registry
          path: bazel-central-registry
          persist-credentials: false

      - name: Stage registry entry
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 tools/stage_bcr_entry.py \
            --source-registry bcr \
            --target-registry bazel-central-registry \
            --module watchman \
            --version "${VERSION}"

      - name: Publish registry branch
        id: publish
        env:
          BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          branch="watchman-${VERSION}"
          registry="bazel-central-registry"
          git -C "${registry}" checkout -b "${branch}"
          git -C "${registry}" add modules/watchman
          git -C "${registry}" \
            -c user.name='pplx-oss' \
            -c user.email='ossmaintainers@perplexity.ai' \
            commit -m "watchman@${VERSION}"
          git -C "${registry}" remote add publish \
            "https://x-access-token:${BCR_PUBLISH_TOKEN}@github.com/perplexityai/bazel-central-registry.git"
          git -C "${registry}" push --force publish "${branch}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Open BCR pull request
        env:
          GH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ steps.publish.outputs.branch }}
        run: |
          set -euo pipefail

          pr_url="$(gh api \
            --method GET \
            repos/bazelbuild/bazel-central-registry/pulls \
            -f state=open \
            -f "head=perplexityai:${BRANCH}" \
            --jq '.[0].html_url')"
          if [[ -z "${pr_url}" ]]; then
            pr_url="$(gh api \
              --method POST \
              repos/bazelbuild/bazel-central-registry/pulls \
              -f "title=watchman@${VERSION}" \
              -f "head=perplexityai:${BRANCH}" \
              -f base=main \
              -f body='Publish the Perplexity-maintained Watchman overlay.' \
              --jq .html_url)"
            pr_number="${pr_url##*/}"
            gh api \
              --method POST \
              "repos/bazelbuild/bazel-central-registry/issues/${pr_number}/comments" \
              -f body='@bazel-io skip_check unstable_url'
          fi
          echo "${pr_url}" >> "${GITHUB_STEP_SUMMARY}"
